    <!-- App shell & boot loader styles -->
    <style>
      html, body, #root {
        background: #05060a;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
      #root { min-height: 100vh; }

      #stea-boot-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.04);
        z-index: 2147483647;
        pointer-events: none;
        overflow: hidden;
      }
      #stea-boot-loader .stea-boot-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent 0%, #f5b544 20%, #f5b544 80%, transparent 100%);
        animation: stea-boot-loader-slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes stea-boot-loader-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      #stea-boot-loader.is-hidden {
        opacity: 0;
        transition: opacity 200ms ease-out;
      }
    </style>

    <script>
      window.__removeSplash = function() {};
    </script>

    <!-- Preload & Inline @font-face for Bricolage Grotesque (Hero) -->
    <link rel="preload" href="/fonts/bricolage-grotesque-900.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-style: normal;
        font-weight: 900;
        font-display: optional;
        src: url('/fonts/bricolage-grotesque-900.woff2') format('woff2');
      }
    </style>
  </head>

    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
